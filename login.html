<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --text: #1b2430;
    --muted: #5d6b7a;
    --border: #c9d1d9;
    --accent: #1f5fbf;
    --error: #b3261e;
    --error-bg: #fdeceb;
    --success: #1b7a43;
    --success-bg: #e6f4ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --surface: #1b222b;
      --text: #e8edf2;
      --muted: #9aa8b6;
      --border: #364250;
      --accent: #6aa3f5;
      --error: #ff8a80;
      --error-bg: #3a1f1d;
      --success: #6fd49a;
      --success-bg: #1b3326;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    place-items: center;
    padding: 1rem;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .95rem; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .35rem; }
  input {
    width: 100%;
    padding: .65rem .75rem;
    font-size: 1rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 1rem;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  input[aria-invalid="true"] { border-color: var(--error); }
  button {
    width: 100%;
    padding: .7rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #0b1420; } }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .message {
    display: none;
    padding: .7rem .8rem;
    border-radius: 6px;
    margin-bottom: 1rem;
    font-size: .92rem;
  }
  .message.show { display: block; }
  .message.error { color: var(--error); background: var(--error-bg); border: 1px solid var(--error); }
  .message.success { color: var(--success); background: var(--success-bg); border: 1px solid var(--success); }
  .hint { margin-top: 1.25rem; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="sub">Enter your email and password to continue.</p>

    <!-- aria-live so screen readers announce the error -->
    <div id="message" class="message" role="alert" aria-live="assertive"></div>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button id="submit" type="submit">Sign in</button>
    </form>

    <p class="hint">Demo account: <code>user@example.com</code> / <code>Password123</code></p>
  </main>

<script>
/* ------------------------------------------------------------------
   Authentication layer
   Replace authenticate() with a real API call (e.g. fetch('/api/login')).
   It must either resolve with a user object or throw an AuthError.
------------------------------------------------------------------- */
class AuthError extends Error {
  constructor(message) {
    super(message);
    this.name = "AuthError";
  }
}

// Demo data only. Never store plaintext passwords in a real app.
const DEMO_USERS = [
  { email: "user@example.com", password: "Password123", name: "Demo User" }
];

function authenticate(email, password) {
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      const user = DEMO_USERS.find(
        u => u.email.toLowerCase() === email.toLowerCase() && u.password === password
      );
      // AC1: invalid credentials are detected.
      // AC2: login is rejected.
      // Same message for unknown email and wrong password, so the error
      // does not reveal which accounts exist.
      if (!user) return reject(new AuthError("Incorrect email or password."));
      resolve({ email: user.email, name: user.name });
    }, 400); // simulated network delay
  });
}

/* ------------------------------------------------------------------
   UI layer
------------------------------------------------------------------- */
const form = document.getElementById("login-form");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submit");
const messageBox = document.getElementById("message");

function showMessage(text, type) {
  messageBox.textContent = text;
  messageBox.className = "message show " + type;
}

function clearMessage() {
  messageBox.textContent = "";
  messageBox.className = "message";
  emailInput.removeAttribute("aria-invalid");
  passwordInput.removeAttribute("aria-invalid");
}

function markInvalid(...inputs) {
  inputs.forEach(i => i.setAttribute("aria-invalid", "true"));
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearMessage();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  // Basic client-side checks
  if (!email || !password) {
    showMessage("Enter both your email and password.", "error");
    markInvalid(...(!email ? [emailInput] : []), ...(!password ? [passwordInput] : []));
    (!email ? emailInput : passwordInput).focus();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Signing in…";

  try {
    const user = await authenticate(email, password);
    showMessage("Welcome back, " + user.name + ". You are signed in.", "success");
    // On success, redirect or load the app here, e.g. window.location.href = "/dashboard";
  } catch (err) {
    // AC3: clear error message displayed.
    // AC4: app does not crash; every failure path is handled here.
    if (err instanceof AuthError) {
      showMessage(err.message + " Check your details and try again.", "error");
      markInvalid(emailInput, passwordInput);
      passwordInput.value = "";
      passwordInput.focus();
    } else {
      console.error("Unexpected login error:", err);
      showMessage("Something went wrong on our side. Try again in a moment.", "error");
    }
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign in";
  }
});

// Clear the error as soon as the user starts correcting their input
[emailInput, passwordInput].forEach(el => el.addEventListener("input", clearMessage));
</script>
</body>
</html>
