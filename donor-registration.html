<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donor registration</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#1b2430;--muted:#5d6978;--line:#d8dee6;--red:#a3182f;--red-ink:#fff;--ok:#1f7a4d;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121820;--surface:#1b2430;--ink:#eaeef3;--muted:#9aa6b5;--line:#2f3b4b;--red:#e5566d;--red-ink:#1a0a0e;--ok:#5fcf97;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121820;--surface:#1b2430;--ink:#eaeef3;--muted:#9aa6b5;--line:#2f3b4b;--red:#e5566d;--red-ink:#1a0a0e;--ok:#5fcf97;--err:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:24px}
h1{font-size:28px;font-weight:800;margin:0}
h2{font-size:18px;font-weight:800;margin:0 0 12px}
p.sub{margin:4px 0 0;color:var(--muted)}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.full{grid-column:1/-1}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:1px}
textarea{resize:vertical;min-height:72px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:2px}
.hint{color:var(--muted);font-size:13px;margin-top:2px}
.idrow{display:flex;gap:8px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:6px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--red);color:var(--red-ink);border-color:var(--red)}
button.link{border:0;background:none;color:var(--red);padding:4px 8px}
.hist{display:grid;grid-template-columns:1fr 110px 1.4fr auto;gap:8px;margin-bottom:8px;align-items:start}
@media(max-width:640px){.hist{grid-template-columns:1fr 1fr}.hist input:nth-child(3){grid-column:1/-1}}
.actions{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
#msg{font-weight:600}
.ok{color:var(--ok)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-weight:800}
.bg{display:inline-block;min-width:44px;text-align:center;font-weight:800;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:1px 6px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.top input{max-width:280px}
.empty{color:var(--muted);padding:16px 0}
@media (prefers-reduced-motion:no-preference){#msg{transition:opacity .3s}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Donor registration</h1>
    <p class="sub">Register new donors and manage existing records.</p>
  </header>

  <section aria-labelledby="fh">
    <h2 id="fh"><span id="formTitle">Register a donor</span></h2>
    <form id="f" novalidate>
      <div class="grid">
        <div>
          <label for="donorId">Donor ID</label>
          <div class="idrow">
            <input id="donorId" autocomplete="off" aria-describedby="idE">
            <button type="button" id="gen">Generate</button>
          </div>
          <div class="hint">A unique ID is created automatically. You can overwrite it.</div>
          <div class="err" id="idE"></div>
        </div>
        <div>
          <label for="name">Full name</label>
          <input id="name" autocomplete="off" aria-describedby="nameE">
          <div class="err" id="nameE"></div>
        </div>
        <div>
          <label for="bg">Blood group</label>
          <select id="bg" aria-describedby="bgE">
            <option value="">Select blood group</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
          <div class="err" id="bgE"></div>
        </div>
        <div>
          <label for="phone">Phone number</label>
          <input id="phone" type="tel" inputmode="tel" aria-describedby="phoneE">
          <div class="err" id="phoneE"></div>
        </div>
        <div class="full">
          <label for="email">Email (optional)</label>
          <input id="email" type="email" aria-describedby="emailE">
          <div class="err" id="emailE"></div>
        </div>
        <div class="full">
          <label for="addr">Address</label>
          <textarea id="addr" aria-describedby="addrE"></textarea>
          <div class="err" id="addrE"></div>
        </div>
        <div class="full">
          <label>Donation history</label>
          <div id="hist"></div>
          <button type="button" class="link" id="addH">Add a past donation</button>
          <div class="err" id="histE"></div>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="submit" id="save">Register donor</button>
        <button type="button" id="cancel" hidden>Cancel edit</button>
        <span id="msg" role="status" aria-live="polite"></span>
      </div>
    </form>
  </section>

  <section aria-labelledby="lh">
    <div class="top">
      <h2 id="lh" style="margin:0">Registered donors (<span id="count">0</span>)</h2>
      <div>
        <label for="q" class="hint" style="margin:0">Search</label>
        <input id="q" type="search" placeholder="Name, ID, or blood group">
      </div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Group</th><th>Contact</th><th>Donations</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty">No donors registered yet. Use the form above to add the first one.</div>
  </section>
</main>

<script>
(function(){
  var KEY = 'bloodbank.donors.v1';
  var donors = [];
  var editing = null; // donor ID being edited

  function load(){
    try { var r = localStorage.getItem(KEY); donors = r ? JSON.parse(r) : []; }
    catch(e){ donors = []; }
    if(!Array.isArray(donors)) donors = [];
  }
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(donors)); return true; }
    catch(e){ return false; }
  }
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function today(){ return new Date().toISOString().slice(0,10); }

  // Unique donor ID: DNR-<yyMMdd>-<4 random chars>, regenerated until unused
  function newId(){
    var d = new Date(), pad = function(n){ return String(n).padStart(2,'0'); };
    var stamp = String(d.getFullYear()).slice(2) + pad(d.getMonth()+1) + pad(d.getDate());
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', id;
    do {
      var s = ''; for(var i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
      id = 'DNR-' + stamp + '-' + s;
    } while(donors.some(function(x){ return x.id === id; }));
    return id;
  }

  // Donation history rows
  function addHistRow(h){
    h = h || {date:'', ml:450, note:''};
    var row = document.createElement('div'); row.className = 'hist';
    row.innerHTML =
      '<input type="date" aria-label="Donation date" max="'+today()+'" value="'+esc(h.date)+'">' +
      '<input type="number" aria-label="Volume in ml" min="50" max="1000" step="10" value="'+esc(h.ml)+'">' +
      '<input type="text" aria-label="Location or note" placeholder="Location or note" value="'+esc(h.note)+'">' +
      '<button type="button" class="link" aria-label="Remove donation">Remove</button>';
    row.querySelector('button').onclick = function(){ row.remove(); };
    $('hist').appendChild(row);
  }
  function readHist(){
    return Array.prototype.map.call($('hist').children, function(r){
      var i = r.querySelectorAll('input');
      return {date:i[0].value, ml:Number(i[1].value), note:i[2].value.trim()};
    });
  }

  function setErr(id, msg){ $(id).textContent = msg || ''; return !msg; }

  function validate(){
    var ok = true, id = $('donorId').value.trim();
    ok = setErr('idE', !id ? 'Enter a donor ID or select Generate.' :
      !/^[A-Za-z0-9_-]{3,30}$/.test(id) ? 'Use 3–30 letters, numbers, hyphens or underscores.' :
      donors.some(function(d){ return d.id.toLowerCase() === id.toLowerCase() && d.id !== editing; }) ? 'This donor ID is already in use.' : '') && ok;
    ok = setErr('nameE', $('name').value.trim().length < 2 ? 'Enter the donor’s full name.' : '') && ok;
    ok = setErr('bgE', !$('bg').value ? 'Select a blood group.' : '') && ok;
    var digits = $('phone').value.replace(/\D/g,'');
    ok = setErr('phoneE', digits.length < 7 || digits.length > 15 ? 'Enter a valid phone number (7–15 digits).' : '') && ok;
    var em = $('email').value.trim();
    ok = setErr('emailE', em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em) ? 'Enter a valid email address.' : '') && ok;
    ok = setErr('addrE', $('addr').value.trim().length < 5 ? 'Enter the donor’s address.' : '') && ok;
    var hist = readHist(), bad = hist.some(function(h){
      return !h.date || h.date > today() || !(h.ml >= 50 && h.ml <= 1000);
    });
    ok = setErr('histE', bad ? 'Each donation needs a date that is not in the future and a volume of 50–1000 ml.' : '') && ok;
    return ok;
  }

  function flash(text, good){
    var m = $('msg'); m.textContent = text; m.className = good ? 'ok' : '';
    clearTimeout(flash.t); flash.t = setTimeout(function(){ m.textContent = ''; }, 4000);
  }

  function resetForm(){
    editing = null;
    $('f').reset(); $('hist').innerHTML = '';
    ['idE','nameE','bgE','phoneE','emailE','addrE','histE'].forEach(function(x){ setErr(x,''); });
    $('donorId').value = newId();
    $('formTitle').textContent = 'Register a donor';
    $('save').textContent = 'Register donor';
    $('cancel').hidden = true;
  }

  function render(){
    var q = $('q').value.trim().toLowerCase();
    var list = donors.filter(function(d){
      return !q || (d.id+' '+d.name+' '+d.bloodGroup).toLowerCase().indexOf(q) > -1;
    });
    $('count').textContent = donors.length;
    $('empty').hidden = list.length > 0;
    $('empty').textContent = donors.length ? 'No donors match your search.' : 'No donors registered yet. Use the form above to add the first one.';
    $('rows').innerHTML = list.map(function(d){
      var last = d.history.length ? d.history.map(function(h){ return h.date; }).sort().pop() : null;
      return '<tr><td>'+esc(d.id)+'</td><td>'+esc(d.name)+'</td>' +
        '<td><span class="bg">'+esc(d.bloodGroup)+'</span></td>' +
        '<td>'+esc(d.phone)+(d.email?'<br>'+esc(d.email):'')+'<br>'+esc(d.address)+'</td>' +
        '<td>'+d.history.length+(last?' (last: '+esc(last)+')':'')+'</td>' +
        '<td><button class="link" data-a="edit" data-id="'+esc(d.id)+'">Edit</button>' +
        '<button class="link" data-a="del" data-id="'+esc(d.id)+'">Delete</button></td></tr>';
    }).join('');
  }

  $('rows').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var id = b.dataset.id, d = donors.filter(function(x){ return x.id === id; })[0];
    if(!d) return;
    if(b.dataset.a === 'del'){
      if(confirm('Delete donor ' + d.name + ' (' + d.id + ')? This cannot be undone.')){
        donors = donors.filter(function(x){ return x.id !== id; });
        persist(); render(); flash('Donor deleted.', true);
      }
    } else {
      resetForm(); editing = d.id;
      $('donorId').value = d.id; $('name').value = d.name; $('bg').value = d.bloodGroup;
      $('phone').value = d.phone; $('email').value = d.email || ''; $('addr').value = d.address;
      d.history.forEach(addHistRow);
      $('formTitle').textContent = 'Edit donor ' + d.id;
      $('save').textContent = 'Save changes';
      $('cancel').hidden = false;
      $('f').scrollIntoView({behavior:'smooth'}); $('name').focus();
    }
  });

  $('f').addEventListener('submit', function(e){
    e.preventDefault();
    if(!validate()){ flash('Fix the highlighted fields.', false); return; }
    var rec = {
      id: $('donorId').value.trim(), name: $('name').value.trim(), bloodGroup: $('bg').value,
      phone: $('phone').value.trim(), email: $('email').value.trim(), address: $('addr').value.trim(),
      history: readHist().sort(function(a,b){ return a.date < b.date ? 1 : -1; }),
      registeredAt: new Date().toISOString()
    };
    if(editing){
      var i = donors.findIndex(function(x){ return x.id === editing; });
      rec.registeredAt = donors[i].registeredAt; donors[i] = rec;
    } else donors.unshift(rec);
    var saved = persist(), wasEdit = !!editing;
    render(); resetForm();
    flash(saved ? (wasEdit ? 'Changes saved.' : 'Donor registered.') : 'Saved for this session only: browser storage is unavailable.', saved);
  });

  $('gen').onclick = function(){ $('donorId').value = newId(); setErr('idE',''); };
  $('addH').onclick = function(){ addHistRow(); };
  $('cancel').onclick = resetForm;
  $('q').addEventListener('input', render);

  load(); resetForm(); render();
})();
</script>
</body>
</html>
